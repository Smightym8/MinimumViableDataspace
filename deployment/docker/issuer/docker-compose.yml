services:
  dataspace-issuer-server:
    image: nginx:latest
    container_name: dataspace-issuer-server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../../assets/issuer/did.vm.json:/var/www/.well-known/did.json
      - ../../assets/issuer/nginx.conf:/etc/nginx/nginx.conf

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug